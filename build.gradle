plugins {
    id 'net.minecrell.plugin-yml.bukkit' version '0.6.0'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id 'com.gradleup.shadow' version '9.0.0-beta4'

    id "io.papermc.paperweight.userdev" version "2.0.0-beta.21" apply false
}

group = 'org.eu.pcraft'
version = '1.6'
dev = project.dev

allprojects {
    apply plugin: "java"
    apply plugin: "java-library"

    java {
        sourceCompatibility = JavaVersion.toVersion(21)
        targetCompatibility = JavaVersion.toVersion(21)
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
        maven {
            name = "papermc-repo"
            url = "https://repo.papermc.io/repository/maven-public/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/groups/public/"
        }
        maven {
            name = "CodeMC"
            url = uri("https://repo.codemc.io/repository/maven-public/")
        }
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        // lombok
        compileOnly 'org.projectlombok:lombok:1.18.46'
        annotationProcessor 'org.projectlombok:lombok:1.18.46'
        testCompileOnly 'org.projectlombok:lombok:1.18.46'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
        // 配置框架用插件自带的一份（org.eu.pcraft.powerfulfireworks.libs.config），
        // 它依赖 snakeyaml，由根工程的 include 配置打进 jar 并重定位。
    }
}

subprojects {
    group = rootProject.group
    version = rootProject.version
}

configurations {
    include
    implementation.extendsFrom(include)
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.19.4-R0.1-SNAPSHOT'
    include 'org.bstats:bstats-bukkit:3.0.2'
    compileOnly "com.github.MilkBowl:VaultAPI:1.7"

    include project(":nms")
    // 26.x 是 Mojang 映射、运行时不重映射，直接打包普通 jar（见 nms/v26_3/build.gradle）
    include project(path: ":nms:v26_3", configuration: "mojangJar")
    for (String version : new String[]{"v1_21_4"}) {    // versions with remapper
        include project(path: ":nms:$version")
    }
    for (String version : new String[]{"v1_20_4", "v1_20_2", "v1_19_4", "v1_18_2"}) {   // versions without remapper
        include project(path: ":nms:$version", configuration: "reobf")
    }

    include 'cn.afternode.commons:bukkit:2.7.1'
    // 内置配置框架的 YAML 引擎；重定位后与各版本服务端自带的 snakeyaml 互不影响
    include 'org.yaml:snakeyaml:2.6'
    // 脚本引擎（Rhino）：只取 runtime，不含 shell/工具；重定位避免与其它插件带的版本打架
    // 脚本引擎（Rhino）：编译模式需要 1.8.0，1.7.14 在 Java 25 上编译生成器脚本会失败
    include 'org.mozilla:rhino:1.9.2'
}

bukkit {
    name = "PowerfulFireworks"
    main = "org.eu.pcraft.powerfulfireworks.PowerfulFireworks"
    apiVersion = "1.18"
    depend = ['Vault']
}


runServer {
    minecraftVersion(project.property("run.version") as String)

    downloadPlugins {
//        modrinth("nbtapi", "2.15.5")
    }
}

tasks.withType(xyz.jpenilla.runtask.task.AbstractRun) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    jvmArgs("-XX:+AllowEnhancedClassRedefinition")
}

compileJava {
    options.release = 17
}

shadowJar {
    configurations = [project.configurations.include]

    dependencies {
        exclude(dependency("net.kyori:option"))
    }

    relocate "org.bstats", "org.eu.pcraft.powerfulfireworks.bstats"
    // snakeyaml 只被内置配置框架使用，重定位避免和不同版本服务端自带的版本打架
    relocate "org.yaml.snakeyaml", "org.eu.pcraft.powerfulfireworks.libs.snakeyaml"
    // Rhino 故意不重定位：编译模式下 Codegen 把方法描述符当字符串常量存着
    // （形如 "Lorg/mozilla/javascript/Context;I"），重定位只改类引用、不改这些字符串，
    // 生成的类一加载就 NoClassDefFoundError。Paper 每个插件一个类加载器，不重定位也不会互相串。
    def dev = Boolean.parseBoolean(project.getProperties().get("dev").toString())
    println "Dev: ${dev}"
    if (!dev) {
        println "Relocation enabled"
        for (var s in new String[]{"cn.afternode"}) {
            relocate s, "org.eu.pcraft.powerfulfireworks.libs.${s}"
            println "relocate $s -> org.eu.pcraft.powerfulfireworks.${s}"
        }
    }
    manifest {
        attributes["paperweight-mappings-namespace"] = "spigot"
    }
}

tasks.register("downloadVanillaServer", Exec) {
    def version = project.property("run.version") as String
    it.group "run paper"
    commandLine("curl", "-L", "https://bmclapi2.bangbang93.com/version/$version/server", "-o", "run/cache/mojang_${version}.jar")

    doFirst {
        def cacheDir = project.layout.projectDirectory.dir("run").dir("cache").asFile

        if (!cacheDir.exists())
            cacheDir.mkdirs()
    }
}
