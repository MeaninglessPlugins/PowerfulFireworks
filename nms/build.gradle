dependencies {
    api project(":nms:common")

    for (String version : new String[]{"v1_21_4", "v1_20_4", "v1_20_2", "v1_19_4", "v1_18_2"}) {
        compileOnly project(":nms:$version")
    }
    // 26.x 模块没有 reobf 变体，走专用配置拿普通 jar
    compileOnly project(path: ":nms:v26_3", configuration: "mojangJar")
}

// 26.3 模块由 25 的 toolchain 编译、输出 21 的字节码，所以这里的编译 classpath 要接受 Java 21 的库
configurations.compileClasspath {
    attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
    }
}

compileJava {
    options.release = 17
}
