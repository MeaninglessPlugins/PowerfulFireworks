name: "Dev Build"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # 26.3 之前的模块是按 Java 17 的反编译结果打补丁的，setup 任务需要 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
        
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2.4.2
      
      - name: Execute Gradle build
        run: ./gradlew shadowJar

      - uses: actions/upload-artifact@v4
        with:
          name: Package JAR
          path: build/libs
